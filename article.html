<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 — Taiwan Pop 2026</title>
  <link rel="icon" type="image/png" href="images/logo-main_48x48.png">
  <link rel="apple-touch-icon" href="images/logo-main_48x48.png">

  <!-- Canonical & hreflang（JS 會動態更新 canonical） -->
  <link rel="canonical" href="https://taiwanpop.tw/article.html" id="meta-canonical">
  <link rel="alternate" hreflang="zh-TW" href="https://taiwanpop.tw/news.html">
  <link rel="alternate" hreflang="en"    href="https://taiwanpop.tw/news.html?lang=en">
  <link rel="alternate" hreflang="x-default" href="https://taiwanpop.tw/news.html">

  <!-- Open Graph（JS 會動態更新內容） -->
  <meta property="og:type"        content="article">
  <meta property="og:locale"      content="zh_TW">
  <meta property="og:site_name"   content="Taiwan Pop">
  <meta property="og:url"         content="https://taiwanpop.tw/article.html" id="meta-og-url">
  <meta property="og:title"       content="最新消息 — Taiwan Pop 2026" id="meta-og-title">
  <meta property="og:description" content="Taiwan Pop 2026 最新消息" id="meta-og-desc">
  <meta property="og:image"       content="https://taiwanpop.tw/images/logo-main.png" id="meta-og-image">
  <meta property="og:image:alt"   content="Taiwan Pop" id="meta-og-image-alt">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="最新消息 — Taiwan Pop 2026" id="meta-tw-title">
  <meta name="twitter:description" content="Taiwan Pop 2026 最新消息" id="meta-tw-desc">
  <meta name="twitter:image"       content="https://taiwanpop.tw/images/logo-main.png" id="meta-tw-image">

  <link rel="stylesheet" href="css/tp-shared.css">
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;700;900&display=swap"></noscript>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K6V2LJ748H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K6V2LJ748H');
  </script>

  <style>
  /* ── HERO ── */
  .article-hero {
    padding-top: 5rem;
    display: grid; grid-template-columns: 1fr 1fr;
    position: relative;
  }
  .article-hero-left {
    padding: 3rem 3rem 3.5rem 2.5rem;
    display: flex; flex-direction: column; justify-content: flex-start;
    border-right: 1px solid var(--border);
  }
  .article-hero-content { margin: auto 0; }
  .article-meta-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
  .article-date { font-family: var(--font-m); font-size: var(--fs-base); letter-spacing: 0.14em; color: rgba(255,255,255,0.3); }
  .article-title {
    font-family: var(--font-d);
    font-size: clamp(2.5rem, 5.5vw, 5.5rem);
    line-height: 0.95; letter-spacing: 0.025em;
    text-shadow: 3px 3px 0 rgba(0,255,87,0.2);
  }
  .article-hero-right {
    position: relative; overflow: hidden; background: #0e0e0e;
    aspect-ratio: 16/9; align-self: center;
  }
  .article-hero-right img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .article-hero-placeholder {
    width: 100%; height: 100%;
    background: url('images/Taiwan Pop_Supporting Graphic 3_星光背景_拆圖版.webp') center/cover no-repeat;
    opacity: 0.5;
  }

  /* ── HERO CAT LABEL (plain, no background) ── */
  .art-cat-label {
    font-family: var(--font-m); font-size: var(--fs-base);
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }

  /* ── ARTICLE WRAP ── */
  .article-wrap {
    display: grid; grid-template-columns: 1fr 320px;
    gap: 5rem; max-width: 1200px; margin: 0 auto;
    padding: 4rem 2.5rem 6rem;
  }
  .article-section-label {
    font-family: var(--font-m); font-size: var(--fs-base);
    letter-spacing: 0.28em; color: rgba(255,255,255,0.25);
    display: block; margin-bottom: 1rem;
  }
  .article-body {
    font-size: var(--fs-base); line-height: 2.1;
    color: rgba(255,255,255,0.65);
  }
  .article-body p { margin-bottom: 1.4rem; font-size: var(--fs-base); line-height: 2.1; }
  .article-body p:empty,
  .article-body p:has(> br:only-child) { display: none; }
  .article-body h2 {
    font-family: var(--font-d); font-size: 2rem; letter-spacing: 0.04em;
    color: var(--white); margin: 2.5rem 0 1rem;
    text-shadow: 2px 2px 0 rgba(0,255,87,0.2);
  }
  .article-body h3 {
    font-family: var(--font-d); font-size: 1.4rem; letter-spacing: 0.04em;
    color: var(--white); margin: 2rem 0 0.8rem;
  }
  .article-body strong { color: var(--white); font-weight: 500; }
  .article-body a { color: var(--green); border-bottom: 1px solid rgba(0,255,87,0.3); transition: border-color 0.2s; }
  .article-body a:hover { border-color: var(--green); }
  .article-body img { max-width: 100%; margin: 1.5rem 0; display: block; }
  .article-body ul, .article-body ol { padding-left: 1.5rem; margin-bottom: 1.2rem; }
  .article-body li { margin-bottom: 0.5rem; }
  .article-body blockquote,
  .article-pullquote {
    border-left: 3px solid var(--green);
    padding: 1.2rem 1.5rem; margin: 2.5rem 0;
    background: rgba(0,255,87,0.04);
  }
  .article-pullquote p,
  .article-body blockquote p {
    font-size: var(--fs-base); line-height: 1.8;
    color: rgba(255,255,255,0.75); font-style: italic; margin: 0;
  }

  /* ── SIDEBAR ── */
  .sidebar-section {
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section:first-child { border-top: 1px solid var(--border); }
  .sidebar-title {
    font-family: var(--font-m); font-size: var(--fs-base);
    letter-spacing: 0.22em; color: rgba(255,255,255,0.28); margin-bottom: 0.8rem;
  }
  .sidebar-event {
    display: flex; flex-direction: column; gap: 0.3rem;
    text-decoration: none; color: var(--white);
    padding: 1rem; background: #0e0e0e;
    border-left: 2px solid var(--green);
    transition: background 0.2s; margin-top: 0.6rem;
  }
  .sidebar-event:hover { background: #141414; }
  .sidebar-event-cat { margin-bottom: 0.3rem; }
  .sidebar-event-title { font-family: var(--font-d); font-size: 1.2rem; letter-spacing: 0.03em; line-height: 1.1; }
  .sidebar-event-date { font-family: var(--font-m); font-size: var(--fs-base); letter-spacing: 0.1em; color: rgba(255,255,255,0.3); }
  .share-btns { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .share-btn {
    width: 2.6rem; height: 2.6rem;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.45); transition: all 0.2s;
    cursor: pointer; background: transparent;
    position: relative;
  }
  .share-btn svg { display: block; }
  .share-btn:hover { border-color: var(--green); color: var(--green); }
  .share-btn[title]:hover::after {
    content: attr(title);
    position: absolute; bottom: calc(100% + 6px); left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85); color: var(--white);
    font-family: var(--font-m); font-size: 0.75rem;
    letter-spacing: 0.08em; white-space: nowrap;
    padding: 0.25rem 0.5rem; pointer-events: none;
  }
  .related-list { display: flex; flex-direction: column; }
  .related-item {
    display: flex; gap: 1rem; align-items: flex-start;
    padding: 0.9rem 0; border-bottom: 1px solid var(--border);
    text-decoration: none; color: var(--white);
  }
  .related-item:last-child { border: none; }
  .related-date { font-family: var(--font-m); font-size: var(--fs-base); color: rgba(255,255,255,0.25); margin-top: 0.15rem; flex-shrink: 0; }
  .related-title-text { font-size: var(--fs-base); line-height: 1.5; transition: color 0.2s; }
  .related-item:hover .related-title-text { color: var(--green); }

  /* ── LOADING / ERROR ── */
  .article-loading, .article-error {
    text-align: center; padding: 80px 0;
    color: rgba(255,255,255,0.3);
    font-family: var(--font-m); font-size: var(--fs-base); letter-spacing: 0.1em;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 960px) {
    .article-hero { grid-template-columns: 1fr; min-height: auto; height: auto; }
    .article-hero-left { border-right: none; border-bottom: 1px solid var(--border); }
    .article-hero-right { display: block; aspect-ratio: 16/9; height: auto; }
    .article-wrap { grid-template-columns: 1fr; gap: 3rem; }
  }
  @media (max-width: 600px) {
    .article-hero-left { padding: 3rem 1.5rem 2rem; }
    .article-hero-right { aspect-ratio: 16/9; height: auto; }
    .article-wrap { padding: 2rem 1.5rem 4rem; }
  }
  </style>
</head>
<body>

  <nav id="navbar"></nav>

  <div id="article-root">
    <div class="article-loading">載入中</div>
  </div>

  <footer id="contact"></footer>

  <script src="js/lang.js"></script>
  <script src="js/data.js?v=3"></script>
  <script src="js/components.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/lang-init.js"></script>

  <script type="module">
    import { db } from './js/firebase.js';
    import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

    const params    = new URLSearchParams(window.location.search);
    const articleId = params.get('id');
    let articleData  = null;
    let relatedData  = [];

    const CAT_CLASS = {
      '官方公告': 'cat-announce',
      '活動預告': 'cat-preview',
      '專題報導': 'cat-feature',
      '媒體報導': 'cat-media',
    };
    const CAT_LABEL_EN = {
      '官方公告': 'Announcement',
      '活動預告': 'Preview',
      '專題報導': 'Feature',
      '媒體報導': 'Media',
    };

    function getLang() {
      return window.currentLang || localStorage.getItem('twpop_lang') || 'zh';
    }

    function formatDate(str) {
      return (str || '').replace(/-/g, '.');
    }

    function shortDate(str) {
      return (str || '').slice(5).replace(/-/g, '.');
    }

    function relatedHtml(lang) {
      if (!relatedData.length) return '';
      return relatedData.map(a => {
        const t = (lang === 'en' && a.title_en) ? a.title_en : (a.title || '');
        return `<a href="article.html?id=${a.id}" class="related-item">
          <span class="related-date">${shortDate(a.date)}</span>
          <span class="related-title-text">${t}</span>
        </a>`;
      }).join('');
    }

    function relatedEventHtml(a, lang) {
      if (!a.relatedEventNum) return '';
      const ev = (typeof EVENTS !== 'undefined') && EVENTS.find(e => e.num === a.relatedEventNum);
      if (!ev) return '';
      const t    = (lang === 'en' && ev.title_en) ? ev.title_en : ev.title;
      const date = formatDate(ev.date);
      const loc  = (lang === 'en' && ev.location_full) ? ev.location_full : ev.location;
      const catId = ev.category;
      return `
        <div class="sidebar-section">
          <div class="sidebar-title">RELATED EVENT · 相關活動</div>
          <a href="event.html?num=${ev.num}" class="sidebar-event">
            <div class="sidebar-event-cat"><span class="cat cat-${catId}">${catId.toUpperCase()}</span></div>
            <div class="sidebar-event-title">${t}</div>
            <div class="sidebar-event-date">${date}${loc ? ' · ' + loc : ''}</div>
          </a>
        </div>`;
    }

    function render(a) {
      const lang    = getLang();
      const title   = (lang === 'en' && a.title_en)   ? a.title_en   : (a.title   || '');
      const content = (lang === 'en' && a.content_en) ? a.content_en : (a.content || '');
      const cat      = a.category || '';
      const catCls   = CAT_CLASS[cat] || 'cat-media';
      const catLabel = lang === 'en' ? (CAT_LABEL_EN[cat] || cat) : cat;
      document.title = `${title} — Taiwan Pop 2026`;

      // ── 動態更新 SEO meta ──
      const rawDesc = a.content ? a.content.replace(/<[^>]*>/g, '').trim() : title;
      const descShort = rawDesc.length > 160 ? rawDesc.slice(0, 157) + '...' : rawDesc;
      const imgUrl = a.coverImage || 'https://taiwanpop.tw/images/logo-main.png';
      const pageUrl = `https://taiwanpop.tw/article.html?id=${new URLSearchParams(location.search).get('id')}`;
      const setMeta = (id, val) => { const el = document.getElementById(id); if (el) el.setAttribute(el.hasAttribute('content') ? 'content' : 'href', val); };
      setMeta('meta-canonical',    pageUrl);
      setMeta('meta-og-url',       pageUrl);
      setMeta('meta-og-title',     `${title} — Taiwan Pop 2026`);
      setMeta('meta-og-desc',      descShort);
      setMeta('meta-og-image',     imgUrl);
      setMeta('meta-og-image-alt', title);
      setMeta('meta-tw-title',     `${title} — Taiwan Pop 2026`);
      setMeta('meta-tw-desc',      descShort);
      setMeta('meta-tw-image',     imgUrl);
      document.querySelector('meta[name="description"]')?.setAttribute('content', descShort);

      const coverHtml = a.coverImage
        ? `<img src="${a.coverImage}" alt="${title}" loading="lazy">`
        : `<div class="article-hero-placeholder"></div>`;

      const shareLabel = lang === 'en' ? 'SHARE' : '分享';
      const moreLabel  = lang === 'en' ? 'MORE NEWS' : '更多消息';

      document.getElementById('article-root').innerHTML = `
        <div class="article-hero">
          <div class="article-hero-left">
            <div class="article-hero-content">
              <div class="article-meta-row">
                ${cat ? `<span class="art-cat-label">${catLabel}</span>` : ''}
                <span class="article-date">${formatDate(a.date)}</span>
              </div>
              <h1 class="article-title">${title}</h1>
            </div>
          </div>
          <div class="article-hero-right">${coverHtml}</div>
        </div>

        <div class="article-wrap">
          <article class="article-content">
            <div class="article-body">${content}</div>
          </article>

          <aside class="article-sidebar">
            ${relatedEventHtml(a, lang)}
            <div class="sidebar-section">
              <div class="sidebar-title">${shareLabel}</div>
              <div class="share-btns">
                <button class="share-btn" id="share-fb" title="Facebook" aria-label="Share on Facebook">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                </button>
                <button class="share-btn" id="share-x" title="X (Twitter)" aria-label="Share on X">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </button>
                <button class="share-btn" id="share-threads" title="Threads" aria-label="Share on Threads">
                  <svg viewBox="0 0 192 192" width="17" height="17" fill="currentColor"><path d="M141.537 88.988a66.667 66.667 0 0 0-2.518-1.143c-1.482-27.307-16.403-42.94-41.457-43.1h-.34c-14.986 0-27.449 6.396-35.12 18.036l13.779 9.452c5.73-8.695 14.724-10.548 21.348-10.548h.232c8.246.052 14.47 2.452 18.502 7.13 2.932 3.405 4.893 8.11 5.864 14.05-7.314-1.243-15.224-1.626-23.68-1.14-23.82 1.371-39.134 15.264-38.105 34.568.522 9.792 5.4 18.216 13.735 23.719 7.047 4.652 16.124 6.927 25.557 6.412 12.458-.683 22.231-5.436 29.049-14.127 5.178-6.6 8.453-15.153 9.899-25.93 5.937 3.583 10.337 8.298 12.767 13.966 4.132 9.635 4.373 25.468-8.546 38.376-11.319 11.308-24.925 16.2-45.488 16.351-22.809-.169-40.06-7.484-51.275-21.742C35.236 139.966 29.808 120.682 29.605 96c.203-24.682 5.63-43.966 16.133-57.317C56.954 24.425 74.206 17.11 97.015 16.94c22.975.17 40.526 7.52 52.171 21.847 5.71 7.026 10.015 15.86 12.853 26.162l16.147-4.308c-3.44-12.68-8.853-23.606-16.219-32.668C147.036 10.606 125.202.195 97.28 0h-.36C69.108.195 47.528 10.63 32.898 28.008 19.797 43.54 13.038 65.37 12.802 95.933l-.003.067.003.067c.236 30.563 7 52.394 20.095 67.925 14.63 17.378 36.21 26.813 62.302 27.008h.36c23.8-.172 43.048-7.234 57.026-20.988 19.012-18.979 18.402-42.714 12.168-57.223-4.48-10.456-13.033-18.944-24.219-24.801z"/></svg>
                </button>
                <button class="share-btn" id="share-copy" title="${lang === 'en' ? 'Copy Link' : '複製連結'}" aria-label="${lang === 'en' ? 'Copy Link' : '複製連結'}">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                </button>
              </div>
            </div>
            ${relatedData.length ? `
            <div class="sidebar-section">
              <div class="sidebar-title">${moreLabel}</div>
              <div class="related-list">${relatedHtml(lang)}</div>
            </div>` : ''}
          </aside>
        </div>`;

      /* share buttons */
      const url = encodeURIComponent(window.location.href);
      const txt = encodeURIComponent(title);
      document.getElementById('share-fb')?.addEventListener('click', () =>
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank'));
      document.getElementById('share-x')?.addEventListener('click', () =>
        window.open(`https://twitter.com/intent/tweet?url=${url}&text=${txt}`, '_blank'));
      document.getElementById('share-threads')?.addEventListener('click', () =>
        window.open(`https://www.threads.net/intent/post?text=${txt}%20${url}`, '_blank'));
      document.getElementById('share-copy')?.addEventListener('click', function() {
        navigator.clipboard.writeText(window.location.href).then(() => {
          const copyTip = lang === 'en' ? 'Copied!' : '已複製！';
          this.setAttribute('title', copyTip);
          this.style.borderColor = 'var(--green)';
          this.style.color = 'var(--green)';
          setTimeout(() => {
            this.setAttribute('title', lang === 'en' ? 'Copy Link' : '複製連結');
            this.style.borderColor = '';
            this.style.color = '';
          }, 2000);
        });
      });
    }

    async function loadRelated(currentId) {
      try {
        const q = query(collection(db, 'articles'), where('published', '==', true));
        const snap = await getDocs(q);
        const all = [];
        snap.forEach(d => { if (d.id !== currentId) all.push({ id: d.id, ...d.data() }); });
        all.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        relatedData = all.slice(0, 4);
      } catch (_) {}
    }

    async function loadArticle() {
      const root = document.getElementById('article-root');
      if (!articleId) {
        root.innerHTML = '<div class="article-error">找不到文章</div>';
        return;
      }
      try {
        const [snap] = await Promise.all([
          getDoc(doc(db, 'articles', articleId)),
          loadRelated(articleId),
        ]);
        if (!snap.exists() || !snap.data().published) {
          root.innerHTML = '<div class="article-error">文章不存在或尚未發布</div>';
          return;
        }
        articleData = snap.data();
        render(articleData);
      } catch (err) {
        console.error(err);
        root.innerHTML = '<div class="article-error">載入失敗，請稍後再試</div>';
      }
    }

    window.reRenderNews = function () {
      if (articleData) render(articleData);
    };

    loadArticle();
  </script>

</body>
</html>
